<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Jafir Islam Siam - Full-Stack Engineer and AI/ML Researcher" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0B2F27"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5A0"/>
      <stop offset="1" stop-color="#00D9F5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#00F5A0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00F5A0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .name{font-size:64px;font-weight:800;fill:#fff;letter-spacing:-1px;animation:rise 1s ease-out both}
    .role{font-size:24px;font-weight:500;fill:url(#accent);animation:rise 1s .2s ease-out both}
    .info{font-size:15px;fill:#9AA4B2;animation:rise 1s .4s ease-out both}
    .cardbg{fill:#ffffff;fill-opacity:0.05;stroke:#00F5A0;stroke-opacity:0.35}
    .num{font-size:30px;font-weight:800;fill:#00F5A0}
    .lbl{font-size:13px;fill:#B8C1CC}
    .card{animation:rise 1s ease-out both}
    .c1{animation-delay:.5s}.c2{animation-delay:.65s}.c3{animation-delay:.8s}.c4{animation-delay:.95s}
    .wave1{animation:drift 9s ease-in-out infinite alternate}
    .wave2{animation:drift 13s ease-in-out infinite alternate-reverse}
    .t{font-size:16px;fill:#00F5A0;opacity:0}
    .t1{animation:swap 9s infinite 0s}.t2{animation:swap 9s infinite 3s}.t3{animation:swap 9s infinite 6s}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
    @keyframes swap{0%{opacity:0}6%{opacity:1}30%{opacity:1}36%{opacity:0}100%{opacity:0}}
    @keyframes blink{50%{opacity:0}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <path class="wave1" d="M-80 300 C 200 240, 400 340, 700 280 S 1100 240, 1300 290 L1300 340 L-80 340Z" fill="#00F5A0" fill-opacity="0.07"/>
    <path class="wave2" d="M-80 320 C 250 270, 500 350, 800 300 S 1150 280, 1300 315 L1300 340 L-80 340Z" fill="#00D9F5" fill-opacity="0.07"/>
    <rect x="60" y="52" width="56" height="5" rx="2.5" fill="url(#accent)"/>
  </g>

  <text class="name sans" x="60" y="130">Jafir Islam Siam</text>
  <text class="role sans" x="60" y="170">Full-Stack Engineer  ·  AI &amp; ML Researcher</text>
  <text class="info sans" x="60" y="202">Dhaka, Bangladesh   |   CSE @ AIUB   |   Zaytoon Business Solutions   |   AIRIL</text>

  <g class="mono">
    <text class="t t1" x="60" y="236">&gt; building scalable systems with NestJS &amp; Next.js</text>
    <text class="t t2" x="60" y="236">&gt; shipping production software with ASP.NET Core</text>
    <text class="t t3" x="60" y="236">&gt; publishing applied AI research on IEEE Xplore</text>
  </g>

  <g class="sans">
    <g class="card c1"><rect class="cardbg" x="60" y="262" width="250" height="56" rx="12"/>
      <text class="num" x="80" y="298">5</text><text class="lbl" x="110" y="296">Peer-reviewed publications</text></g>
    <g class="card c2"><rect class="cardbg" x="330" y="262" width="250" height="56" rx="12"/>
      <text class="num" x="350" y="298">3</text><text class="lbl" x="380" y="296">Papers accepted</text></g>
    <g class="card c3"><rect class="cardbg" x="600" y="262" width="250" height="56" rx="12"/>
      <text class="num" x="620" y="298">300+</text><text class="lbl" x="684" y="296">Problems solved</text></g>
    <g class="card c4"><rect class="cardbg" x="870" y="262" width="250" height="56" rx="12"/>
      <text class="num" x="890" y="298">5x</text><text class="lbl" x="934" y="296">Dean's Honor List</text></g>
  </g>
</svg>
